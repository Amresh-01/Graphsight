[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsight-server"
version = "0.1.0"
description = "Zero-dependency local trace viewer server and CLI for Graphsight."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Graphsight Team" }]
keywords = ["tracing", "observability", "rag", "agents", "visualization", "cli"]
dependencies = []

[project.scripts]
graphsight = "graphsight_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphsight_server*"]

[tool.setuptools.package-data]
graphsight_server = ["dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
